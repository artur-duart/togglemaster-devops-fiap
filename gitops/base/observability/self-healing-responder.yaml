apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing-responder
  namespace: observability
  labels:
    app.kubernetes.io/part-of: togglemaster-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing-responder
  namespace: togglemaster
  labels:
    app.kubernetes.io/part-of: togglemaster-observability
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing-responder
  namespace: togglemaster
  labels:
    app.kubernetes.io/part-of: togglemaster-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healing-responder
subjects:
  - kind: ServiceAccount
    name: self-healing-responder
    namespace: observability
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing-responder
  namespace: observability
  labels:
    app.kubernetes.io/part-of: togglemaster-observability
spec:
  selector:
    app: self-healing-responder
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-responder
  namespace: observability
  labels:
    app: self-healing-responder
    app.kubernetes.io/part-of: togglemaster-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healing-responder
  template:
    metadata:
      labels:
        app: self-healing-responder
    spec:
      serviceAccountName: self-healing-responder
      containers:
        - name: responder
          image: python:3.11-slim
          command: ["python", "/app/responder.py"]
          ports:
            - containerPort: 8080
          env:
            - name: TARGET_NAMESPACE
              value: togglemaster
            - name: COOLDOWN_SECONDS
              value: "1800"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: self-healing-responder-code
