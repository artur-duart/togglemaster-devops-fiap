apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.4.1
    helm:
      valuesObject:
        prometheus:
          prometheusSpec:
            retention: 5d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1Gi
        alertmanager:
          alertmanagerSpec:
            secrets:
              - alertmanager-integrations
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
          config:
            global:
              resolve_timeout: 5m
            inhibit_rules:
              - source_matchers:
                  - severity = "emergency"
                target_matchers:
                  - severity =~ "critical|warning|info"
                equal:
                  - incident
              - source_matchers:
                  - severity = "critical"
                target_matchers:
                  - severity =~ "warning|info"
                equal:
                  - namespace
                  - alertname
              - source_matchers:
                  - severity = "warning"
                target_matchers:
                  - severity = "info"
                equal:
                  - namespace
                  - alertname
              - source_matchers:
                  - alertname = "InfoInhibitor"
                target_matchers:
                  - severity = "info"
                equal:
                  - namespace
              - target_matchers:
                  - alertname = "InfoInhibitor"
            route:
              group_by:
                - alertname
                - exported_job
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: discord
              routes:
                - matchers:
                    - alertname = "Watchdog"
                  receiver: "null"
                - matchers:
                    - alertname = "InfoInhibitor"
                  receiver: "null"
                - matchers:
                    - severity = "info"
                  receiver: "null"
                - matchers:
                    - alertname =~ "ToggleMaster.*"
                    - severity = "critical"
                  receiver: self-healing
                  group_wait: 10s
                  continue: true
                - matchers:
                    - severity = "emergency"
                  receiver: pagerduty
                  continue: true
                - matchers:
                    - severity = "emergency"
                  receiver: discord-emergencia
                - receiver: discord
            receivers:
              - name: "null"

              - name: self-healing
                webhook_configs:
                  - url: http://self-healing-responder.observability.svc:8080/alert
                    send_resolved: false

              - name: pagerduty
                pagerduty_configs:
                  - service_key_file: /etc/alertmanager/secrets/alertmanager-integrations/pagerduty-service-key
                    description: '[N1] {{ .CommonLabels.alertname }} em {{ .CommonLabels.exported_job }}{{ .CommonLabels.pod }}'
                    details:
                      servico: '{{ .CommonLabels.exported_job }}{{ .CommonLabels.pod }}'
                      namespace: '{{ .CommonLabels.namespace }}'
                      resumo: '{{ .CommonAnnotations.summary }}'
                      impacto: '{{ .CommonAnnotations.impacto }}'
                      acao: '{{ .CommonAnnotations.acao }}'
                      runbook: '{{ .CommonAnnotations.runbook_url }}'
                      dashboard: '{{ .CommonAnnotations.dashboard_url }}'
                    send_resolved: true

              - name: discord-emergencia
                discord_configs:
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-integrations/discord-webhook-emergencia
                    title: '{{ if eq .Status "firing" }}[N1 EMERGENCIA]{{ else }}[RESOLVIDO]{{ end }} {{ .CommonLabels.alertname }}'
                    message: |-
                      {{ .CommonAnnotations.summary }}

                      Servico: {{ .CommonLabels.exported_job }}{{ .CommonLabels.pod }}
                      Impacto: {{ .CommonAnnotations.impacto }}
                      Acao: {{ .CommonAnnotations.acao }}
                      Runbook: {{ .CommonAnnotations.runbook_url }}

                      O plantonista foi acionado no PagerDuty porque a mitigacao automatica nao resolveu.
                    send_resolved: true

              - name: discord
                discord_configs:
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-integrations/discord-webhook-geral
                    title: '{{ if eq .Status "firing" }}[N{{ if .CommonLabels.nivel }}{{ .CommonLabels.nivel }}{{ else }}3{{ end }}]{{ else }}[RESOLVIDO]{{ end }} {{ .CommonLabels.alertname }}'
                    message: |-
                      {{ .CommonAnnotations.summary }}

                      Servico: {{ .CommonLabels.exported_job }}{{ .CommonLabels.pod }}
                      Impacto: {{ .CommonAnnotations.impacto }}
                      Acao: {{ .CommonAnnotations.acao }}
                      Runbook: {{ .CommonAnnotations.runbook_url }}
                    send_resolved: true
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki.observability.svc:3100
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
