name: flag-service CI

on:
  push:
    paths:
      - "services/flag-service/**"
      - ".github/workflows/flag-service.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flag-service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flags
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/flag-service/requirements.txt

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Unit Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flags
          AUTH_SERVICE_URL: http://localhost:9999
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: services/flag-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint (erros reais)
        run: flake8 . --select=E9,F63,F7,F82 --show-source

  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/flag-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: bandit (SAST)
        run: |
          pip install bandit
          bandit -r . --severity-level high

      - name: Trivy (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: services/flag-service
          severity: CRITICAL
          exit-code: "1"

  build-push:
    runs-on: ubuntu-latest
    needs: security
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::376903139600:role/togglemaster-github-actions
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: services/flag-service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/flag-service:$IMAGE_TAG .
          docker push $REGISTRY/flag-service:$IMAGE_TAG
