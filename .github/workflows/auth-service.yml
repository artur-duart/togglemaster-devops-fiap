name: auth-service CI

on:
  push:
    branches: [main]
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/reusable-go-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/reusable-go-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/reusable-go-ci.yml
    permissions:
      id-token: write
      contents: read
    with:
      service: auth-service
