name: auth-service CI

on:
  push:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: services/auth-service/go.sum

      - name: Build
        run: go build ./...

      - name: Unit Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: services/auth-service/go.sum

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: services/auth-service/go.sum

      - name: gosec (SAST)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.23.0
          gosec -severity high ./...

      - name: Trivy (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: services/auth-service
          severity: CRITICAL
          exit-code: "1"

  build-push:
    runs-on: ubuntu-latest
    needs: security
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::376903139600:role/togglemaster-github-actions
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: services/auth-service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/auth-service:$IMAGE_TAG .
          docker push $REGISTRY/auth-service:$IMAGE_TAG
