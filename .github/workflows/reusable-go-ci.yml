name: reusable-go-ci

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      go-version:
        required: false
        type: string
        default: "1.25"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: services/${{ inputs.service }}/go.sum

      - name: Build
        run: go build ./...

      - name: Unit Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: services/${{ inputs.service }}/go.sum

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: services/${{ inputs.service }}/go.sum

      - name: gosec (SAST)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.23.0
          gosec -severity high ./...

      - name: Trivy (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: services/${{ inputs.service }}
          severity: CRITICAL
          exit-code: "1"

  build-push:
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::376903139600:role/togglemaster-github-actions
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        working-directory: services/${{ inputs.service }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t $REGISTRY/${{ inputs.service }}:$IMAGE_TAG .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.service }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        working-directory: services/${{ inputs.service }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push $REGISTRY/${{ inputs.service }}:$IMAGE_TAG

  sbom:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v5

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: services/${{ inputs.service }}
          format: cyclonedx
          output: sbom-${{ inputs.service }}.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ inputs.service }}
          path: sbom-${{ inputs.service }}.cdx.json

  update-manifest:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install kustomize
        run: |
          curl -sfLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Set image tag in manifest
        run: |
          cd gitops/base/${{ inputs.service }}
          kustomize edit set image 376903139600.dkr.ecr.us-east-1.amazonaws.com/${{ inputs.service }}=376903139600.dkr.ecr.us-east-1.amazonaws.com/${{ inputs.service }}:${{ github.sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/base/${{ inputs.service }}/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): ${{ inputs.service }} -> ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push
