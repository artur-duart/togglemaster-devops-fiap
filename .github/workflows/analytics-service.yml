name: analytics-service CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/analytics-service/**"
      - ".github/workflows/analytics-service.yml"
      - ".github/workflows/reusable-python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/analytics-service/**"
      - ".github/workflows/analytics-service.yml"
      - ".github/workflows/reusable-python-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/reusable-python-ci.yml
    permissions:
      id-token: write
      contents: write
    with:
      service: analytics-service
