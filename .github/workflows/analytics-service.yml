name: analytics-service CI

on:
  push:
    paths:
      - "services/analytics-service/**"
      - ".github/workflows/analytics-service.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analytics-service/requirements.txt

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Unit Test
        env:
          AWS_REGION: us-east-1
          AWS_SQS_URL: http://localhost:9999
          AWS_DYNAMODB_TABLE: dummy
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: services/analytics-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint (erros reais)
        run: flake8 . --select=E9,F63,F7,F82 --show-source

  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/analytics-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: bandit (SAST)
        run: |
          pip install bandit
          bandit -r . --severity-level high

      - name: Trivy (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: services/analytics-service
          severity: CRITICAL
          exit-code: "1"

  build-push:
    runs-on: ubuntu-latest
    needs: security
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::376903139600:role/togglemaster-github-actions
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: services/analytics-service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/analytics-service:$IMAGE_TAG .
          docker push $REGISTRY/analytics-service:$IMAGE_TAG
