name: targeting-service CI

on:
  push:
    branches: [main]
    paths:
      - "services/targeting-service/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/reusable-python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/targeting-service/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/reusable-python-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/reusable-python-ci.yml
    permissions:
      id-token: write
      contents: read
    with:
      service: targeting-service
